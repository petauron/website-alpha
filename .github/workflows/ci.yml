name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.base_ref || 'none' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine CI scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          run_ci=true
          scope_reason='full-default'

          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && \
             [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && \
             git merge-base --is-ancestor "$BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null; then
            main_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
            pr_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .merge_commit_sha == "'"$GITHUB_SHA"'" and .base.ref == "main" and .head.repo.full_name == "'"$GITHUB_REPOSITORY"'")] | if length == 1 then .[0].head.sha else empty end' 2>/dev/null || true)"
            if [ -n "$pr_head" ]; then
              pr_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$pr_head" --jq '.tree.sha // empty' 2>/dev/null || true)"
              pr_ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$pr_head&per_page=100" --jq '.workflow_runs | sort_by(.run_number) | last | if . != null and .head_sha == "'"$pr_head"'" and .head_repository.full_name == "'"$GITHUB_REPOSITORY"'" and .status == "completed" and .conclusion == "success" then "ok" else empty end' 2>/dev/null || true)"
              if [ "$pr_tree" = "$main_tree" ] && [ "$pr_ci" = "ok" ]; then
                run_ci=false
                scope_reason='verified-pr-tree'
              fi
            fi
          fi

          echo "Scope ($scope_reason): run_ci=$run_ci"
          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run_ci == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.scope.outputs.run_ci == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: steps.scope.outputs.run_ci == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run format check and static build in parallel
        if: steps.scope.outputs.run_ci == 'true'
        run: |
          set -eu
          format_log="$RUNNER_TEMP/format-check.log"
          pnpm format:check >"$format_log" 2>&1 &
          format_pid=$!

          build_rc=0
          if pnpm build; then
            :
          else
            build_rc=$?
          fi

          format_rc=0
          if wait "$format_pid"; then
            :
          else
            format_rc=$?
          fi

          echo '::group::Format check (pnpm format:check)'
          cat "$format_log"
          echo '::endgroup::'

          if [ "$build_rc" -ne 0 ] || [ "$format_rc" -ne 0 ]; then
            echo "Validation failed: build_exit=$build_rc format_exit=$format_rc" >&2
            exit 1
          fi
